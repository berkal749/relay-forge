name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relayforge_test
          POSTGRES_USER: relayforge
          POSTGRES_PASSWORD: relayforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayforge -d relayforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://relayforge:relayforge@localhost:5432/relayforge_test?sslmode=disable
      TEST_DATABASE_URL: postgres://relayforge:relayforge@localhost:5432/relayforge_test?sslmode=disable
      API_KEY_PEPPER: ci-api-pepper-0123456789abcdef0123456789
      WORKER_TOKEN_PEPPER: ci-worker-pepper-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install tools
        run: |
          go install github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Migrate up
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit and integration tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: sqlc drift check
        run: |
          sqlc generate
          git diff --exit-code -- internal/database/db

      - name: Migration round trip
        run: |
          migrate -path migrations -database "$DATABASE_URL" down -all
          migrate -path migrations -database "$DATABASE_URL" up

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir web lint

      - name: Build
        run: pnpm --dir web build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t relayforge:ci .

      - name: Build dashboard image
        run: docker build -f web/Dockerfile -t relayforge-web:ci .
