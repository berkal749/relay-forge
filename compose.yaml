services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayforge}
      POSTGRES_USER: ${POSTGRES_USER:-relayforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relayforge}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-relayforge}:${POSTGRES_PASSWORD:-relayforge}@postgres:5432/${POSTGRES_DB:-relayforge}?sslmode=disable
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      SESSION_TTL: ${SESSION_TTL:-720h}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-relayforge-development-pepper}
      WORKER_TOKEN_PEPPER: ${WORKER_TOKEN_PEPPER:-}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-600}
      RATE_LIMIT_JOB_SUBMIT_PER_MINUTE: ${RATE_LIMIT_JOB_SUBMIT_PER_MINUTE:-120}
      API_OUTBOX_INTERVAL: ${API_OUTBOX_INTERVAL:-1s}
      API_CLEANUP_INTERVAL: ${API_CLEANUP_INTERVAL:-1h}
      API_REAPER_INTERVAL: ${API_REAPER_INTERVAL:-15s}
      API_WORKER_SWEEP_INTERVAL: ${API_WORKER_SWEEP_INTERVAL:-30s}
      WORKER_LEASE_GRACE: ${WORKER_LEASE_GRACE:-60s}
      WORKER_STALE_AFTER: ${WORKER_STALE_AFTER:-90s}
      TOKEN_ROTATION_GRACE: ${TOKEN_ROTATION_GRACE:-24h}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      WORKER_MTLS_HEADER: ${WORKER_MTLS_HEADER:-}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
    entrypoint: ["/usr/local/bin/relayforge-worker"]
    profiles: ["worker"]
    restart: unless-stopped
    environment:
      WORKER_MODE: remote
      WORKER_PROJECT_ID: ${WORKER_PROJECT_ID:-}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      WORKER_TOKEN_FILE: ${WORKER_TOKEN_FILE:-/var/lib/relayforge/worker-token.json}
      WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_TOKEN:-}
      RELAYFORGE_API_URL: http://api:8080
      WORKER_NAME: ${WORKER_NAME:-relayforge-worker}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-5m}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-30s}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-15s}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-5s}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-5m}
      WORKER_SECRETS_FILE: ${WORKER_SECRETS_FILE:-}
      WORKER_EGRESS_ALLOWLIST: ${WORKER_EGRESS_ALLOWLIST:-}
    volumes:
      - worker_state:/var/lib/relayforge
    depends_on:
      api:
        condition: service_healthy

  supervisor:
    build:
      context: .
    entrypoint: ["/usr/local/bin/relayforge-supervisor"]
    profiles: ["supervisor"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-relayforge}:${POSTGRES_PASSWORD:-relayforge}@postgres:5432/${POSTGRES_DB:-relayforge}?sslmode=disable
      API_KEY_PEPPER: ${API_KEY_PEPPER:-relayforge-development-pepper}
      WORKER_TOKEN_PEPPER: ${WORKER_TOKEN_PEPPER:-}
      RELAYFORGE_API_URL: http://api:8080
      WORKER_ENROLLMENT_TTL: ${WORKER_ENROLLMENT_TTL:-15m}
      SUPERVISOR_POLL_INTERVAL: ${SUPERVISOR_POLL_INTERVAL:-5s}
      SUPERVISOR_WORKER_BINARY: /usr/local/bin/relayforge-worker
      SUPERVISOR_TOKEN_DIR: /var/lib/relayforge/worker-tokens
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-5m}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-30s}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-15s}
      WORKER_CLEANUP_INTERVAL: ${WORKER_CLEANUP_INTERVAL:-1h}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-5s}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-5m}
    volumes:
      - supervisor_state:/var/lib/relayforge
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  worker_state:
  supervisor_state:
